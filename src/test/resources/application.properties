# Test resources: use H2 in-memory database for unit/integration tests
spring.r2dbc.url=${R2DBC_URL:r2dbc:h2:mem:///pedido;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.r2dbc.username=sa
spring.r2dbc.password=

# Flyway will run migrations against the in-memory H2 during tests
spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL:jdbc:h2:mem:pedido;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.flyway.user=sa
spring.flyway.password=
spring.flyway.locations=classpath:db/migration

# Keep test server port default (doesn't affect most tests)
server.port=0

# Base URL used by StockGatewayAdapter during tests (can point to a stub if needed)
stock.base-url=http://localhost:8081
