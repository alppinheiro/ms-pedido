server.port=${APP_PORT:8080}

# Stock base URL for production (override via .env)
stock.base-url=${STOCK_BASE_URL:http://estoque:8081}

# Use POSTGRES_HOST so running locally in debug can point to localhost (or other host)
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pedido}}
spring.r2dbc.username=${POSTGRES_USER:postgres}
spring.r2dbc.password=${POSTGRES_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pedido}}
spring.flyway.user=${POSTGRES_USER:postgres}
spring.flyway.password=${POSTGRES_PASSWORD:postgres}
spring.flyway.locations=classpath:db/migration

# Retry Flyway connection a few times to handle slow DB startups
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:10}
