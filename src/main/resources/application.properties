spring.application.name=pedido

# Default server port (can be overridden via .env APP_PORT)
server.port=${APP_PORT:8080}

# External stock service base URL (override via .env STOCK_BASE_URL)
stock.base-url=${STOCK_BASE_URL:http://localhost:8081}

# Default datasource for normal development/run: expect a Postgres DB configured via env vars.
# When running in containers (docker-compose) set POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pedido}}
spring.r2dbc.username=${POSTGRES_USER:postgres}
spring.r2dbc.password=${POSTGRES_PASSWORD:postgres}

# Flyway will run on the same Postgres DB by default in development/production
spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL:jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:pedido}}
spring.flyway.user=${POSTGRES_USER:postgres}
spring.flyway.password=${POSTGRES_PASSWORD:postgres}
spring.flyway.locations=classpath:db/migration

# NOTE: H2 in-memory database is intended to be used only for tests. See src/test/resources/application.properties

# Resilience4j circuit breaker default config example for stockService
# You can tune these values per environment (dev/prod) in application-dev.properties / application-prod.properties
resilience4j.circuitbreaker.instances.stockService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.stockService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.stockService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.stockService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.stockService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.stockService.permittedNumberOfCallsInHalfOpenState=3

