# application-local.properties: lightweight local profile using H2 in-memory for quick debugging
# NOTE: This is intentionally different from `application-dev.properties`.
# - Use `spring.profiles.active=local` when you want to run the app without a Postgres instance (H2 in-memory).
# - Use `spring.profiles.active=dev` when you want the app to connect to a local Postgres (localhost) for a more realistic dev environment.

# Local development profile using H2 in-memory so you can debug without Postgres
server.port=${APP_PORT:8080}

stock.base-url=${STOCK_BASE_URL:http://localhost:8081}

spring.r2dbc.url=${R2DBC_URL:r2dbc:h2:mem:///pedido;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.r2dbc.username=sa
spring.r2dbc.password=

spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL:jdbc:h2:mem:pedido;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.flyway.user=sa
spring.flyway.password=
spring.flyway.locations=classpath:db/migration

# Optional: enable verbose Flyway logs while debugging
logging.level.org.flyway=DEBUG
