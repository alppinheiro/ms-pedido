# Development profile (when SPRING_PROFILES_ACTIVE=dev)
# Defaults here assume you're running the app locally and have a local Postgres instance
# If you run Postgres inside docker-compose, set POSTGRES_HOST=postgres in your .env instead.

# Prefer connecting to localhost in dev to make IDE/debugging work out-of-the-box
POSTGRES_HOST=localhost
POSTGRES_PORT=5432
POSTGRES_DB=pedido
POSTGRES_USER=postgres
POSTGRES_PASSWORD=postgres

# stock service base URL when running locally
stock.base-url=${STOCK_BASE_URL:http://localhost:8081}

# Allow Flyway to retry a few times in case DB is starting
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:5}

# server port for local dev
server.port=${APP_PORT:8080}


# Resilience4j - make circuit breaker more sensitive in dev for testing
resilience4j.circuitbreaker.instances.stockService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.stockService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.stockService.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.stockService.failureRateThreshold=25
resilience4j.circuitbreaker.instances.stockService.waitDurationInOpenState=10s

spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL:jdbc:h2:mem:pedido;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.flyway.user=sa
spring.flyway.password=
spring.flyway.locations=classpath:db/migration

# Increase logging verbosity for the stock gateway to capture call/metrics timing during tests
logging.level.br.com.pedido.order.adapter.out.stock=DEBUG

# Kafka (development)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=pedido-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Use String deserializer for consumer so listener receives raw JSON string
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*


