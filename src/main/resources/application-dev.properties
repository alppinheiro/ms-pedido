# Development profile (when SPRING_PROFILES_ACTIVE=dev)
# Using PostgreSQL database for local development environment

# Database configuration (PostgreSQL)
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:pedido}}
spring.r2dbc.username=${POSTGRES_USER:postgres}
spring.r2dbc.password=${POSTGRES_PASSWORD:postgres}

spring.flyway.url=${FLYWAY_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:pedido}}
spring.flyway.user=${POSTGRES_USER:postgres}
spring.flyway.password=${POSTGRES_PASSWORD:postgres}
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:5}

# Resilience4j - override specific values to make it more sensitive in dev
resilience4j.circuitbreaker.instances.stockService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.stockService.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.stockService.failureRateThreshold=25
resilience4j.circuitbreaker.instances.stockService.waitDurationInOpenState=10s

# Logging
logging.level.br.com.pedido.order.adapter.out.stock=DEBUG
logging.level.org.flyway=DEBUG

# Kafka (development)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=pedido-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
